<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mouse Sound Field</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f6f1e8;
      --muted: rgba(246, 241, 232, 0.58);
      --line: rgba(246, 241, 232, 0.18);
      --hot: #f95d5d;
      --cool: #4de1c1;
      --gold: #f7c948;
      --blue: #74a7ff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #030303;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      cursor: crosshair;
      user-select: none;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      background:
        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.055), transparent 28rem),
        #030303;
    }

    .hud {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
      pointer-events: none;
      padding: clamp(18px, 4vw, 42px);
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
    }

    .brand {
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.35rem, 3.4vw, 3.35rem);
      font-weight: 680;
      line-height: 0.96;
      letter-spacing: 0;
    }

    .subtitle {
      max-width: 34rem;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: clamp(0.86rem, 1.4vw, 1rem);
      line-height: 1.55;
    }

    .status {
      display: grid;
      grid-template-columns: repeat(3, minmax(82px, 1fr));
      gap: 1px;
      min-width: min(380px, 42vw);
      border: 1px solid var(--line);
      background: var(--line);
    }

    .metric {
      min-width: 0;
      padding: 12px 14px;
      background: rgba(3, 3, 3, 0.68);
      backdrop-filter: blur(18px);
    }

    .label {
      display: block;
      color: var(--muted);
      font-size: 0.68rem;
      line-height: 1;
      text-transform: uppercase;
    }

    .value {
      display: block;
      margin-top: 8px;
      overflow: hidden;
      color: var(--ink);
      font-size: clamp(0.9rem, 1.6vw, 1.1rem);
      font-weight: 620;
      line-height: 1.1;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .center {
      display: grid;
      place-items: center;
      text-align: center;
    }

    .gate {
      width: min(520px, calc(100vw - 36px));
      border: 1px solid rgba(246, 241, 232, 0.28);
      padding: clamp(18px, 4vw, 34px);
      background: rgba(3, 3, 3, 0.44);
      backdrop-filter: blur(24px);
      transition: opacity 220ms ease, transform 220ms ease;
    }

    .gate.hidden {
      opacity: 0;
      transform: translateY(10px) scale(0.98);
    }

    .gate strong {
      display: block;
      font-size: clamp(1.15rem, 3vw, 2rem);
      line-height: 1.08;
      font-weight: 700;
    }

    .gate span {
      display: block;
      margin-top: 12px;
      color: var(--muted);
      font-size: clamp(0.86rem, 1.8vw, 1rem);
      line-height: 1.55;
    }

    .sound-strip {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 6px;
      width: 100%;
      align-items: end;
    }

    .sound-dot {
      height: 18px;
      border: 1px solid rgba(246, 241, 232, 0.2);
      background: rgba(246, 241, 232, 0.06);
      transform-origin: bottom;
      transition: background 120ms ease, border-color 120ms ease, transform 120ms ease;
    }

    .sound-dot.active {
      border-color: rgba(246, 241, 232, 0.72);
      background: var(--dot-color, var(--cool));
      transform: scaleY(1.85);
    }

    @media (max-width: 760px) {
      .hud {
        padding: 16px;
      }

      .topbar {
        display: grid;
      }

      .status {
        width: 100%;
        min-width: 0;
      }

      .subtitle {
        max-width: 100%;
      }

      .sound-strip {
        gap: 4px;
      }
    }
  </style>
</head>
<body>
  <canvas id="field" aria-hidden="true"></canvas>

  <main class="hud" aria-live="polite">
    <section class="topbar">
      <div class="brand">
        <h1>Mouse Sound Field</h1>
        <p class="subtitle">点击一次打开声音，然后移动鼠标。速度会改变声调，位置和节奏会切换不同音色。</p>
      </div>

      <div class="status" aria-label="声音状态">
        <div class="metric">
          <span class="label">Sound</span>
          <span class="value" id="soundName">locked</span>
        </div>
        <div class="metric">
          <span class="label">Speed</span>
          <span class="value" id="speedValue">0 px/s</span>
        </div>
        <div class="metric">
          <span class="label">Pitch</span>
          <span class="value" id="pitchValue">0 Hz</span>
        </div>
      </div>
    </section>

    <section class="center">
      <div class="gate" id="gate">
        <strong>点击后，用鼠标给黑场上色。</strong>
        <span>慢慢移动会低沉，快速掠过会尖亮。至少十二种合成音色会跟着你的移动轮换。</span>
      </div>
    </section>

    <section class="sound-strip" id="soundStrip" aria-label="音色列表"></section>
  </main>

  <script>
    const canvas = document.getElementById("field");
    const ctx = canvas.getContext("2d", { alpha: false });
    const gate = document.getElementById("gate");
    const soundName = document.getElementById("soundName");
    const speedValue = document.getElementById("speedValue");
    const pitchValue = document.getElementById("pitchValue");
    const soundStrip = document.getElementById("soundStrip");

    const sounds = [
      { name: "sine lead", color: "#4de1c1", play: playTone("sine", 0.055, 0.13) },
      { name: "square blip", color: "#f95d5d", play: playTone("square", 0.035, 0.08) },
      { name: "triangle bell", color: "#f7c948", play: playTone("triangle", 0.06, 0.22) },
      { name: "saw bass", color: "#74a7ff", play: playTone("sawtooth", 0.045, 0.16, 0.5) },
      { name: "pluck", color: "#ff8a4c", play: playPluck },
      { name: "glass ping", color: "#bde0fe", play: playGlass },
      { name: "noise tick", color: "#ffffff", play: playNoiseTick },
      { name: "kick pulse", color: "#ef476f", play: playKick },
      { name: "snare hiss", color: "#cdb4db", play: playSnare },
      { name: "chime", color: "#80ed99", play: playChime },
      { name: "metallic FM", color: "#ffd166", play: playMetal },
      { name: "soft pad", color: "#90dbf4", play: playPad }
    ];

    let audioContext;
    let masterGain;
    let compressor;
    let unlocked = false;
    let width = 0;
    let height = 0;
    let dpr = 1;
    let lastPoint = null;
    let lastTrigger = 0;
    let latestSpeed = 0;
    let latestPitch = 0;
    let currentSoundIndex = -1;
    let particles = [];

    sounds.forEach((sound, index) => {
      const dot = document.createElement("span");
      dot.className = "sound-dot";
      dot.title = sound.name;
      dot.style.setProperty("--dot-color", sound.color);
      dot.dataset.index = String(index);
      soundStrip.appendChild(dot);
    });

    function setupCanvas() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = "#030303";
      ctx.fillRect(0, 0, width, height);
    }

    function unlockAudio() {
      if (unlocked) return;

      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      compressor = audioContext.createDynamicsCompressor();
      compressor.threshold.value = -18;
      compressor.knee.value = 18;
      compressor.ratio.value = 8;
      compressor.attack.value = 0.003;
      compressor.release.value = 0.18;

      masterGain = audioContext.createGain();
      masterGain.gain.value = 0.55;
      compressor.connect(masterGain);
      masterGain.connect(audioContext.destination);

      unlocked = true;
      gate.classList.add("hidden");
      soundName.textContent = "ready";
      setTimeout(() => {
        gate.style.display = "none";
      }, 260);
    }

    function mapRange(value, inMin, inMax, outMin, outMax) {
      const normalized = Math.max(0, Math.min(1, (value - inMin) / (inMax - inMin)));
      return outMin + (outMax - outMin) * normalized;
    }

    function chooseSound(x, y, speed, now) {
      const zone = Math.floor((x / Math.max(width, 1)) * sounds.length);
      const energy = Math.floor(mapRange(speed, 0, 2400, 0, sounds.length - 1));
      const timeShift = Math.floor(now / 420);
      const verticalShift = Math.floor((y / Math.max(height, 1)) * 4);
      return Math.abs(zone + energy + timeShift + verticalShift) % sounds.length;
    }

    function handleMove(event) {
      const point = getPoint(event);
      if (!point) return;

      const now = performance.now();
      if (!lastPoint) {
        lastPoint = { ...point, time: now };
        addParticles(point.x, point.y, 0, sounds[0].color);
        return;
      }

      const dx = point.x - lastPoint.x;
      const dy = point.y - lastPoint.y;
      const dt = Math.max(now - lastPoint.time, 8);
      const distance = Math.hypot(dx, dy);
      const speed = (distance / dt) * 1000;
      const pitch = Math.round(mapRange(speed, 20, 2600, 120, 1800));
      latestSpeed = Math.round(speed);
      latestPitch = pitch;

      const soundIndex = chooseSound(point.x, point.y, speed, now);
      const sound = sounds[soundIndex];
      addParticles(point.x, point.y, speed, sound.color);
      updateHud(soundIndex);

      if (unlocked && now - lastTrigger > mapRange(speed, 0, 2400, 95, 28)) {
        sound.play(pitch, speed, point.x / Math.max(width, 1));
        lastTrigger = now;
      }

      lastPoint = { ...point, time: now };
    }

    function getPoint(event) {
      if (event.touches && event.touches[0]) {
        return { x: event.touches[0].clientX, y: event.touches[0].clientY };
      }
      if (typeof event.clientX === "number") {
        return { x: event.clientX, y: event.clientY };
      }
      return null;
    }

    function updateHud(index) {
      if (index !== currentSoundIndex) {
        currentSoundIndex = index;
        document.querySelectorAll(".sound-dot").forEach((dot) => {
          dot.classList.toggle("active", Number(dot.dataset.index) === index);
        });
      }
      soundName.textContent = sounds[index].name;
      speedValue.textContent = `${latestSpeed} px/s`;
      pitchValue.textContent = `${latestPitch} Hz`;
    }

    function addParticles(x, y, speed, color) {
      const count = Math.floor(mapRange(speed, 0, 2600, 2, 12));
      for (let i = 0; i < count; i += 1) {
        const angle = Math.random() * Math.PI * 2;
        const force = mapRange(speed, 0, 2600, 0.25, 4.2) * (0.35 + Math.random());
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * force,
          vy: Math.sin(angle) * force,
          size: mapRange(speed, 0, 2600, 1.6, 5.8) * (0.65 + Math.random() * 0.7),
          life: 1,
          decay: 0.012 + Math.random() * 0.025,
          color
        });
      }
      if (particles.length > 520) {
        particles.splice(0, particles.length - 520);
      }
    }

    function draw() {
      ctx.fillStyle = "rgba(3, 3, 3, 0.18)";
      ctx.fillRect(0, 0, width, height);

      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      for (let i = particles.length - 1; i >= 0; i -= 1) {
        const particle = particles[i];
        particle.x += particle.vx;
        particle.y += particle.vy;
        particle.vx *= 0.986;
        particle.vy *= 0.986;
        particle.life -= particle.decay;

        if (particle.life <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.globalAlpha = Math.max(0, particle.life) * 0.82;
        ctx.fillStyle = particle.color;
        ctx.beginPath();
        ctx.arc(particle.x, particle.y, particle.size * particle.life, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      requestAnimationFrame(draw);
    }

    function outputNode(pan = 0.5) {
      const panner = audioContext.createStereoPanner();
      panner.pan.value = mapRange(pan, 0, 1, -0.75, 0.75);
      panner.connect(compressor);
      window.setTimeout(() => {
        try {
          panner.disconnect();
        } catch (error) {
          // The node may already be gone in some browsers.
        }
      }, 900);
      return panner;
    }

    function envelope(gainNode, start, attack, decay, peak, floor = 0.0001) {
      gainNode.gain.cancelScheduledValues(start);
      gainNode.gain.setValueAtTime(floor, start);
      gainNode.gain.linearRampToValueAtTime(peak, start + attack);
      gainNode.gain.exponentialRampToValueAtTime(floor, start + attack + decay);
    }

    function playTone(type, attack, decay, octave = 1) {
      return (pitch, speed, pan) => {
        const now = audioContext.currentTime;
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        const filter = audioContext.createBiquadFilter();

        osc.type = type;
        osc.frequency.setValueAtTime(pitch * octave, now);
        filter.type = "lowpass";
        filter.frequency.value = mapRange(speed, 0, 2600, 420, 5200);
        filter.Q.value = 0.8;
        envelope(gain, now, attack, decay, mapRange(speed, 0, 2600, 0.035, 0.12));

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(outputNode(pan));
        osc.start(now);
        osc.stop(now + attack + decay + 0.04);
      };
    }

    function playPluck(pitch, speed, pan) {
      const now = audioContext.currentTime;
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(pitch * 1.5, now);
      osc.frequency.exponentialRampToValueAtTime(Math.max(80, pitch * 0.72), now + 0.13);
      envelope(gain, now, 0.006, 0.18, mapRange(speed, 0, 2600, 0.045, 0.14));
      osc.connect(gain);
      gain.connect(outputNode(pan));
      osc.start(now);
      osc.stop(now + 0.24);
    }

    function playGlass(pitch, speed, pan) {
      const now = audioContext.currentTime;
      [1, 2.01, 2.78].forEach((ratio, index) => {
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(pitch * ratio, now);
        envelope(gain, now + index * 0.006, 0.004, 0.34, 0.045 / (index + 1));
        osc.connect(gain);
        gain.connect(outputNode(pan));
        osc.start(now + index * 0.006);
        osc.stop(now + 0.42);
      });
    }

    function playNoiseTick(pitch, speed, pan) {
      playNoise(0.045, "highpass", pitch * 0.85, mapRange(speed, 0, 2600, 0.035, 0.11), pan);
    }

    function playKick(pitch, speed, pan) {
      const now = audioContext.currentTime;
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(Math.min(190, pitch), now);
      osc.frequency.exponentialRampToValueAtTime(38, now + 0.16);
      envelope(gain, now, 0.003, 0.18, mapRange(speed, 0, 2600, 0.08, 0.18));
      osc.connect(gain);
      gain.connect(outputNode(pan));
      osc.start(now);
      osc.stop(now + 0.22);
    }

    function playSnare(pitch, speed, pan) {
      playNoise(0.11, "bandpass", mapRange(pitch, 120, 1800, 700, 3600), mapRange(speed, 0, 2600, 0.045, 0.13), pan);
    }

    function playChime(pitch, speed, pan) {
      const now = audioContext.currentTime;
      [0, 4, 7].forEach((semi, index) => {
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.type = "triangle";
        osc.frequency.value = pitch * Math.pow(2, semi / 12);
        envelope(gain, now + index * 0.018, 0.012, 0.24, 0.038);
        osc.connect(gain);
        gain.connect(outputNode(pan));
        osc.start(now + index * 0.018);
        osc.stop(now + 0.34);
      });
    }

    function playMetal(pitch, speed, pan) {
      const now = audioContext.currentTime;
      const carrier = audioContext.createOscillator();
      const modulator = audioContext.createOscillator();
      const modGain = audioContext.createGain();
      const gain = audioContext.createGain();

      carrier.type = "sine";
      carrier.frequency.value = pitch;
      modulator.type = "square";
      modulator.frequency.value = pitch * 1.41;
      modGain.gain.value = mapRange(speed, 0, 2600, 70, 460);
      envelope(gain, now, 0.004, 0.16, mapRange(speed, 0, 2600, 0.035, 0.1));

      modulator.connect(modGain);
      modGain.connect(carrier.frequency);
      carrier.connect(gain);
      gain.connect(outputNode(pan));
      carrier.start(now);
      modulator.start(now);
      carrier.stop(now + 0.22);
      modulator.stop(now + 0.22);
    }

    function playPad(pitch, speed, pan) {
      const now = audioContext.currentTime;
      const gain = audioContext.createGain();
      const filter = audioContext.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.value = mapRange(speed, 0, 2600, 500, 2400);
      envelope(gain, now, 0.055, 0.32, 0.048);
      [0.5, 1, 1.5].forEach((ratio) => {
        const osc = audioContext.createOscillator();
        osc.type = "sine";
        osc.frequency.value = pitch * ratio;
        osc.connect(filter);
        osc.start(now);
        osc.stop(now + 0.43);
      });
      filter.connect(gain);
      gain.connect(outputNode(pan));
    }

    function playNoise(duration, filterType, frequency, volume, pan) {
      const now = audioContext.currentTime;
      const bufferSize = Math.max(1, Math.floor(audioContext.sampleRate * duration));
      const buffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i += 1) {
        data[i] = Math.random() * 2 - 1;
      }

      const source = audioContext.createBufferSource();
      const filter = audioContext.createBiquadFilter();
      const gain = audioContext.createGain();
      source.buffer = buffer;
      filter.type = filterType;
      filter.frequency.value = Math.max(80, frequency);
      filter.Q.value = 1.2;
      envelope(gain, now, 0.002, duration, volume);

      source.connect(filter);
      filter.connect(gain);
      gain.connect(outputNode(pan));
      source.start(now);
      source.stop(now + duration + 0.02);
    }

    window.addEventListener("resize", setupCanvas);
    window.addEventListener("pointerdown", unlockAudio);
    window.addEventListener("pointermove", handleMove, { passive: true });
    window.addEventListener("touchstart", unlockAudio, { passive: true });
    window.addEventListener("touchmove", handleMove, { passive: true });

    setupCanvas();
    draw();
  </script>
</body>
</html>
